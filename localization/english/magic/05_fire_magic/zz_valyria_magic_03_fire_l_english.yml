  zz_valyria_magic_fire_magic.006.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe manipulation of flame is an art as old as ancient Valyria. The dragon lords would command the flame in conjunction with their dragons, and it was always a potent weapon of war. You could call a flame to reveal the secrets of others to [recipient.GetFirstName]. But surely is it wise to invade the secrets of others this way?"
