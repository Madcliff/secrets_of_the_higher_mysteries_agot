l_english:  

  task_contract_prophecy_desc_title:0 "It shall be as I dreamed!"  
  task_contract_prophecy_desc_request:0 "Solve the situation potentially using your [learning|E] or [stewardship|E]"


  
  
  zz_valyria_magic_dream_magic_066_contract:0 "Prophecy: Gold"
  zz_valyria_magic_dream_magic_066_contract_desc:0 "Visions of wealth hidden in lost places have come to you, brough about by the use of magic. Search the location for the rewards of gold."
  zz_valyria_magic_dream_magic_066_contract_desc_title:0 "$task_contract_prophecy_desc_title$"
  zz_valyria_magic_dream_magic_066_contract_request:0 "$task_contract_prophecy_desc_request$"


  zz_valyria_magic_dream_magic_prophecy_task.0002.t:0 "The archives of House [employer.GetHouse.GetBaseNameNoTooltip]"
  zz_valyria_magic_dream_magic_prophecy_task.0002.desc:0 "Our arrival in [employer.GetPrimaryTitle.GetBaseNameNoTier] is met with little fanfare — the locals are in some measure of frustration of our desires to accesss the records stored in this location.\n\nWithout our rapid completion of our examinations the local population may become antagonised by our presence.$zz_valyria_magic_dream_magic_prophecy_task.0002.desc.outro$"
  zz_valyria_magic_dream_magic_prophecy_task.0002.desc.outro:0 "\n\n[employer.GetTitledFirstName|U] is at pains to let us know that their tolerance of our intrusion into their archives has its limits."
  zz_valyria_magic_dream_magic_prophecy_task.0002.a:0 "Let us utilise our administrative mastery"
  zz_valyria_magic_dream_magic_prophecy_task.0002.b:0 "Let us utilise our administrative skill"
  zz_valyria_magic_dream_magic_prophecy_task.0002.c:0 "Let us utilise our learning mastery"
  zz_valyria_magic_dream_magic_prophecy_task.0002.d:0 "Let us utilise our learning skill"

  zz_valyria_magic_dream_magic_prophecy_task.0003.t:0 "$zz_valyria_magic_contracts.0002.t$: Success!"
  zz_valyria_magic_dream_magic_prophecy_task.0003.desc.resolution_type.stewardship:0 "Thankfully, I possess manifold abilities to manage administrative records, and this skill has proven transferable to navigating the archives of House [employer.GetHouse.GetBaseNameNoTooltip]. Thus I rapidly find a true jewel among these records, a scroll from lost Valyria."
  zz_valyria_magic_dream_magic_prophecy_task.0003.desc.resolution_type.secondary_skill:0 "Thankfully, my capacities as a scholar allows me to rapidly find my way through the records stored for the centuries by House [employer.GetHouse.GetBaseNameNoTooltip]. Thus I rapidly find a true jewel among these records, a scroll from lost Valyria."
  zz_valyria_magic_dream_magic_prophecy_task.0003.desc.outro:0 "\n\nWith the scroll in hand, I make my exit before the local authorities can find a reason to 'confiscate' my findings."
  zz_valyria_magic_dream_magic_prophecy_task.0003.a:0 "Eureka!"

  zz_valyria_magic_dream_magic_prophecy_task.0004.t:0 "$zz_valyria_magic_dream_magic_prophecy_task.0002.t$: Failure!"
  zz_valyria_magic_dream_magic_prophecy_task.0004.desc.resolution_type.stewardship:0 "My skills navigating the intricacies of governance sadly have not led me to make any sense of the archives of house [employer.GetHouse.GetBaseNameNoTooltip]. Thus, alas, with regrets I have not found what I was looking for."
  zz_valyria_magic_dream_magic_prophecy_task.0004.desc.resolution_type.secondary_skill:0 "My vaunted scholarly abilities sadly have not led me to make any sense of the archives of house [employer.GetHouse.GetBaseNameNoTooltip]. Thus, alas, with regrets I have not found what I was looking for."
  zz_valyria_magic_dream_magic_prophecy_task.0004.desc.stewardship:0 "Despite my talent for balancing ledgers and managing estates, these archives are a chaotic mess of decaying parchment and illegible scribbles. I have spent days reorganizing their tax records, yet the magical secrets I seek remain buried under mountains of mundane bureaucracy."
  zz_valyria_magic_dream_magic_prophecy_task.0004.desc.outro:0 "\n\nI must leave [employer.GetPrimaryTitle.GetBaseNameNoTier] empty-handed, much to the visible relief of the local librarians."
  zz_valyria_magic_dream_magic_prophecy_task.0004.a:0 "Damnations!"


