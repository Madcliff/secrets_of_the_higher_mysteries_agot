    ## Interaction
  zz_valyria_magic_dream_magic_060.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_ccor$\n\nThrough the use of [dream_magic|E], it is possible to weave the threads of fate anew, creating a chosen relationship between two characters."
  
