  #event
  zz_valyria_magic_dream_magic.006.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.006.name$"
  zz_valyria_magic_dream_magic.006.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can let [recipient.GetFirstName] gain experience in a chosen disicipline of life. But such powers intrude into the soul of the subject. Are you sure this is something you to risk?"
