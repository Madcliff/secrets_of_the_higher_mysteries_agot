  zz_valyria_magic_dream_magic_050.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_cd$\n\nThrough the use of [dream_magic|E], it is possible to grant immediate understanding of a selected [innovation|E] to the chosen [culture|E]."

