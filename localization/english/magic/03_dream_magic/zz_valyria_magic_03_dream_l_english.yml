    ## Interaction
  zz_valyria_magic_dream_magic_059.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cpt$\n\nThrough the use of [dream_magic|E], it is possible to reshape flesh and form, granting or advancing a chosen physical trait within a character."
  
