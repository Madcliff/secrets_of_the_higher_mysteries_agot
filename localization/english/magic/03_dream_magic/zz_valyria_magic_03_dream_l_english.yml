  ## Interaction
  zz_valyria_magic_dream_magic_056.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_scq$\n\nThrough the use of [dream_magic|E], it is possible to behold a prophecy that guides the seeker toward the forgotten mysteries of lost Valyria."
  
  ## Spell Options
