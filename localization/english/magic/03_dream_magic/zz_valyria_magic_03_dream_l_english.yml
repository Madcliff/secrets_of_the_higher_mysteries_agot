  zz_valyria_magic_dream_magic_005.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_mpt$\n\nThrough the use of [dream_magic|E], it is posisble to implant careful whispers and to change a person at the most fundamental level. To change who and what they are."
