  ## Interaction
  zz_valyria_magic_dream_magic_006.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_get$\n\nThrough the use of [dream_magic|E], it is possible to anticipate the future that never was. You can change the entire course of a life, remaking an edcuation.."
