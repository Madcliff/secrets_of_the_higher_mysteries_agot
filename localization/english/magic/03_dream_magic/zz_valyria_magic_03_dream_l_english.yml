    ## Interaction
  zz_valyria_magic_dream_magic_058.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_hc$\n\nThrough the use of [dream_magic|E], it is possible to weave visions of wholeness and restoration, bringing miraculous healing to a chosen character."
  
