    ## Interaction
  zz_valyria_magic_dream_magic_052.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_pcm$\n\nThrough the use of [dream_magic|E], it is possible to add a fortification against miscasting."

