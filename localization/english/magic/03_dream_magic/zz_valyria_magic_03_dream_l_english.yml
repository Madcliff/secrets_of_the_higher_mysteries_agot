  zz_valyria_magic_dream_magic.056.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nVisions rise from the depths of sleep, where shattered towers burn beneath crimson skies and the dead tongues of Valyria whisper from broken stone. Such dreams may reveal the hidden path to secrets long thought consumed by the Doom. Are you sure you wish to cast this prophecy?"
