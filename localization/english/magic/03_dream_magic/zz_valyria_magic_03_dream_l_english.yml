  ## Interaction
  zz_valyria_magic_dream_magic_055.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_idpc$\n\nThrough the use of [dream_magic|E], it is possible to manipulate a character's connection to the forces of magic, inducing a permanent increase to their maximum store of [drops_of_power|E]."

