    ## Interaction
  zz_valyria_magic_dream_magic_057.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_rct$\n\nThrough the use of [dream_magic|E], it is possible to unmake a single chosen trait within a character, severing it from their fate and nature."
  
  ## Spell Options
