  zz_valyria_magic_dream_magic.056.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ weaving a prophecy of smoking ruins, dragon-script tablets, and the hidden secrets of lost Valyrian sorcery."
  zz_valyria_magic_dream_magic.056.toast.tt:0 "$zz_valyria_magic_dream_magic.056.toast.desc$" 
  
  zz_valyria_magic_dream_magic.056.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.056.name$"
