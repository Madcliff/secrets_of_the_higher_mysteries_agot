  zz_valyria_magic_dream_magic.057.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nIn dreams all qualities are mutable, and what is written upon the soul may be erased as easily as ink upon water. By shaping prophecy, a chosen mark upon [recipient.GetFirstName] may be stripped away and cast into oblivion. Are you sure you wish to weave such a fate?"
