  zz_valyria_magic_dream_magic.006.toast.tt:0 "$zz_valyria_magic_dream_magic.006.toast.desc$"

  zz_valyria_magic_dream_magic.006.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.006.name$"
  zz_valyria_magic_dream_magic.006.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.006.f.toast.tt:0 "$zz_valyria_magic_dream_magic.006.f.toast.desc$"



  zz_valyria_magic_dream_magic_007.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_bcm$\n\nThrough the use of [dream_magic|E], it is possible to anticipate future cutural innovations."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.007.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.007.name$"
  zz_valyria_magic_dream_magic.007.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can let [recipient.GetFirstName] see visions of ways their culture could grow and develop. Such visions would let the culture expand rapidly if they happen to be the cultural head. But is it wise to tresspass into the realities of the future?"
  zz_valyria_magic_dream_magic.007.opt.a:0 "Yes, Let them dream of the future!"
  zz_valyria_magic_dream_magic.007.opt.b:0 "Add a new cultural tradition instead!"
  zz_valyria_magic_dream_magic.007.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.007.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.007.name$"
  zz_valyria_magic_dream_magic.007.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ revealing insights into possible cultural innovations."
  zz_valyria_magic_dream_magic.007.toast.tt:0 "$zz_valyria_magic_dream_magic.007.toast.desc$"

  zz_valyria_magic_dream_magic.007.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.007.name$"
  zz_valyria_magic_dream_magic.007.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.007.f.toast.tt:0 "$zz_valyria_magic_dream_magic.007.f.toast.desc$"




  zz_valyria_magic_dream_magic_008.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cwok$\n\nThrough the use of [dream_magic|E], it is possible to strike down your foes directly with debilitating visions of what yet may be."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.008.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.008.name$"
  zz_valyria_magic_dream_magic.008.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can let [recipient.GetFirstName] see monstrous dreams, entrapping them away from the world, or indeed even striking them to their very death. But is it wise to tresspass into the realities of the dream?"
  zz_valyria_magic_dream_magic.008.opt.a:0 "Yes, strike them with a debilitating dream!"
  zz_valyria_magic_dream_magic.008.opt.b:0 "Yes, send them to the dream!"
  zz_valyria_magic_dream_magic.008.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.008.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.008.name$"
  zz_valyria_magic_dream_magic.008.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ revealing insights into possible cultural innovations."
  zz_valyria_magic_dream_magic.008.toast.tt:0 "$zz_valyria_magic_dream_magic.008.toast.desc$"

  zz_valyria_magic_dream_magic.008.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.008.name$"
  zz_valyria_magic_dream_magic.008.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.008.f.toast.tt:0 "$zz_valyria_magic_dream_magic.008.f.toast.desc$"



  zz_valyria_magic_dream_magic_009.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n\nThrough the use of [dream_magic|E], it is possible to seek minor insights into the future."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.009.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.009.name$"
  zz_valyria_magic_dream_magic.009.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can let [recipient.GetFirstName] have minor visions of the future. Such visions might be about advances in their skillls, or be visions that inspire their to take up the tasks worthy of achievement. But is it wise to tresspass into the realities of the future?"
  zz_valyria_magic_dream_magic.009.opt.a:0 "Yes, Let them dream of the future!"
  zz_valyria_magic_dream_magic.009.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.009.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.009.name$"
  zz_valyria_magic_dream_magic.009.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ revealing insights into possible future outcomes."
  zz_valyria_magic_dream_magic.009.toast.tt:0 "$zz_valyria_magic_dream_magic.009.toast.desc$"

  zz_valyria_magic_dream_magic.009.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.009.name$"
  zz_valyria_magic_dream_magic.009.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.009.f.toast.tt:0 "$zz_valyria_magic_dream_magic.009.f.toast.desc$"


  zz_valyria_magic_dream_magic_010.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_bcm$\n\nThrough the use of [dream_magic|E], it is possible to draw upon the power of future dreams, improving [drops_of_power|E] gain in the present.."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.010.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.010.name$"
  zz_valyria_magic_dream_magic.010.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can manipulate the conceptual substance of [recipient.GetFirstName]. This will improve the rate at which they are able to generate upon [drops_of_power|E]. But is it worth it to seek to draw upon such powers greater than the natural ken?"
  zz_valyria_magic_dream_magic.010.opt.a:0 "Yes, Let them dream of power!"
  zz_valyria_magic_dream_magic.010.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.010.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.010.name$"
  zz_valyria_magic_dream_magic.010.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ drawing forth future potentials to increase [drops_of_power|E] gain in the present."
  zz_valyria_magic_dream_magic.010.toast.tt:0 "$zz_valyria_magic_dream_magic.010.toast.desc$"

  zz_valyria_magic_dream_magic.010.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.010.name$"
  zz_valyria_magic_dream_magic.010.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.010.f.toast.tt:0 "$zz_valyria_magic_dream_magic.010.f.toast.desc$"


  zz_valyria_magic_dream_magic_011.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_rp$\n\nThrough the use of [dream_magic|E], it is possible to enter the mind of a character, to take from within their mind knowledge of the schemes they are plotting, and to expose these schemes and their accomplices."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.011.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.011.name$"
  zz_valyria_magic_dream_magic.011.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can scour the mind of [recipient.GetFirstName] for their nefarious schemes. This will rip from them the knowledge of the plots they are undertaking, exposing to the world their true diabolical character. But is it worth while to reveal their depravity?"
  zz_valyria_magic_dream_magic.011.opt.a:0 "Yes, Let us take the knowledge of their plots!"
  zz_valyria_magic_dream_magic.011.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.011.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.011.name$"
  zz_valyria_magic_dream_magic.011.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ revealing one of [recipient.GetFirstName]'s' plots for the world to know."
  zz_valyria_magic_dream_magic.011.toast.tt:0 "$zz_valyria_magic_dream_magic.011.toast.desc$"

  zz_valyria_magic_dream_magic.011.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.011.name$"
  zz_valyria_magic_dream_magic.011.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.011.f.toast.tt:0 "$zz_valyria_magic_dream_magic.011.f.toast.desc$"

  zz_valyria_magic_dream_magic_012.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_rp$\n\nThrough the use of [dream_magic|E], it is possible to enter the mind of a character, and from this rooted tree grasp a scheme that is targeting them to reveal it to the world."
  ## Spell Options
  #event
  zz_valyria_magic_dream_magic.012.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.012.name$"
  zz_valyria_magic_dream_magic.012.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can scour the mind of [recipient.GetFirstName] for their inutitions of the plots that target them. Such magic will reveal all that is planned against them, and let you expose this twisted reality to the entire world. Are you sure you wish to do this?"
  zz_valyria_magic_dream_magic.012.opt.a:0 "Yes, Let us take the knowledge of the plots that target them!"
  zz_valyria_magic_dream_magic.012.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.012.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.012.name$"
  zz_valyria_magic_dream_magic.012.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ revealing one plot that is targeting [recipient.GetFirstName] for all the world to know."
  zz_valyria_magic_dream_magic.012.toast.tt:0 "$zz_valyria_magic_dream_magic.012.toast.desc$"

