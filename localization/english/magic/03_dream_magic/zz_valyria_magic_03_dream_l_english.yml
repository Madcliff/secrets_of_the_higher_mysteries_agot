

l_english:

  
  ## Dream Magic Magic
  zz_valyria_magic_dream_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_gh$\n$zz_cf$\n\nThrough the use of [dream_magic|E], it is possible to bind another into service, compelling their obedience."
  ## event
  zz_valyria_magic_dream_magic.001.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.001.name$"
  zz_valyria_magic_dream_magic.001.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. A most terrifying power is to bring this primal shared reality upon a subject's mind and bring them into compliance. Even the most deeply held convictions can be commanded in this manner. Do you wish to wield such a power againt [recipient.GetFirstName] to remake their very self?"
  zz_valyria_magic_dream_magic.001.opt.a:0 "Yes, Take their Mind!"
  zz_valyria_magic_dream_magic.001.opt.b:0 "Yes, Mind, Body, and Soul!"
  zz_valyria_magic_dream_magic.001.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.001.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.001.name$"
  zz_valyria_magic_dream_magic.001.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ , they have brought [recipient.GetFirstName] under the power of [actor.GetFirstName]."
  zz_valyria_magic_dream_magic.001.toast.tt:0 "$zz_valyria_magic_dream_magic.001.toast.desc$"

  zz_valyria_magic_dream_magic.001.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.001.name$"
  zz_valyria_magic_dream_magic.001.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.001.f.toast.tt:0 "$zz_valyria_magic_dream_magic.001.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_glt$\n\nThrough the use of [dream_magic|E], it is possible to anticipate the future yet to come. To gain experince in the fields of study you have yet to undertake."

  #event
  zz_valyria_magic_dream_magic.002.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.002.name$"
  zz_valyria_magic_dream_magic.002.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can let [recipient.GetFirstName] gain experience in a chosen disicipline of life. But such powers intrude into the soul of the subject. Are you sure this is something you to risk?"
  zz_valyria_magic_dream_magic.002.opt.a:0 "Yes, Let them dream of a lifetime!"
  zz_valyria_magic_dream_magic.002.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.002.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.002.name$"
  zz_valyria_magic_dream_magic.002.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ making it possible to acquire the knowledge of arts you are yet to possess."
  zz_valyria_magic_dream_magic.002.toast.tt:0 "$zz_valyria_magic_dream_magic.002.toast.desc$"

  zz_valyria_magic_dream_magic.002.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.002.name$"
  zz_valyria_magic_dream_magic.002.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.002.f.toast.tt:0 "$zz_valyria_magic_dream_magic.002.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_003.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_glx$\n\nThrough the use of [dream_magic|E], it is possible to take up the experiences of the great masters of the arts of life. Choose a lifestyle, and let the chosen character gain experience in this lifestyle."
  #event
  zz_valyria_magic_dream_magic.003.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.003.name$"
  zz_valyria_magic_dream_magic.003.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. It is possible to induce in [recipient.GetFirstName] dreams of possible fiutures and to gain experience in lifestyles they have not yet achieved. Is this an intrusion into the realm of the God of dreams you wish to make?"
  zz_valyria_magic_dream_magic.003.opt.a:0 "Yes,  dream of Learning!"
  zz_valyria_magic_dream_magic.003.opt.b:0 "Yes,  dream of Diplomacy!"
  zz_valyria_magic_dream_magic.003.opt.c:0 "Yes,  dream of Stewardship!"
  zz_valyria_magic_dream_magic.003.opt.d:0 "Yes,  dream of Intrigue!"
  zz_valyria_magic_dream_magic.003.opt.e:0 "Yes,  dream of Martial!"
  zz_valyria_magic_dream_magic.003.opt.f:0 "Yes,  dream of Wandering!"
  zz_valyria_magic_dream_magic.003.opt.g:0 "Yes,  dream of Prowess!"
  zz_valyria_magic_dream_magic.003.opt.h:0 "Yes,  dream of Leadership!"
  zz_valyria_magic_dream_magic.003.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.003.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.003.name$"
  zz_valyria_magic_dream_magic.003.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ making it possible to acquire the knowledge experience in the myriad walks of life."
  zz_valyria_magic_dream_magic.003.toast.tt:0 "$zz_valyria_magic_dream_magic.003.toast.desc$"

  zz_valyria_magic_dream_magic.003.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.003.name$"
  zz_valyria_magic_dream_magic.003.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.003.f.toast.tt:0 "$zz_valyria_magic_dream_magic.003.f.toast.desc$"

  ## Interaction
  zz_valyria_magic_dream_magic_004.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n\nThrough the use of [dream_magic|E], it is possible to learn many things. Secrets, plots, and indeed knowledge of things remote."

  #event
  zz_valyria_magic_dream_magic.004.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe lingering power of dreams is more than a subtle undercurrent of the world, but rather, an subtle and enduring legacy of creation's common origins. Through their dreams you can let [recipient.GetFirstName] gain knowledge of the secrets of those who surround them. While they will not be able to choose which secrets are learned, such dreams have a great utility in knowing the plots that are forming in the minds of ones contemparies. But do you wish to violate privacy in such a way?"
  zz_valyria_magic_dream_magic.004.opt.a:0 "Yes, Let them dream of the unknown!"
  zz_valyria_magic_dream_magic.004.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_dream_magic.004.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.toast.desc:0 "$zz_toast_01$ [dream_magic|E], $zz_toast_02$ bringing forth many knowledges of things yet unknown."
  zz_valyria_magic_dream_magic.004.toast.tt:0 "$zz_valyria_magic_dream_magic.004.toast.desc$"

  zz_valyria_magic_dream_magic.004.f.toast.t:0 "Failure [dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.f.toast.desc:0 "$zz_toast_01$ [dream_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_dream_magic.004.f.toast.tt:0 "$zz_valyria_magic_dream_magic.004.f.toast.desc$"

  zz_valyria_magic_dream_magic.004.buff.toast.t:0 "[dream_magic|E] - $zz_valyria_magic_dream_magic.004.name$"
  zz_valyria_magic_dream_magic.004.buff.toast.desc:0 "Your dreams have shown to you a secret relating to [dreaming_magic_secret_target.GetNameNoTooltip]"
  zz_valyria_magic_dream_magic.004.buff.toast.tt:0 "$zz_valyria_magic_dream_magic.048.buff.toast.desc$"



