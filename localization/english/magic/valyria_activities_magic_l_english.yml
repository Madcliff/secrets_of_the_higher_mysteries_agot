### Learn Magic Spell Event


## Blood Sacrifice Event
valyria_blood_sacrifices.1.t:0 "Sacrifice of Blood to the Flame"
valyria_blood_sacrifices.1.desc:0 "Through the invocation of flame, an offering of blood can transform the realities of nature and enable many great feats of magic. You have a chosen sacrifice, and this offering to the flames of blood shall bring forth the powers of your participants to wield great magics once more."
valyria_blood_sacrifices.1.a:0 "Chant from an ancient scroll of power"
valyria_blood_sacrifices.1.a.great:0 "An ancient intelligence smiles upon you, and the star touches your soul."
valyria_blood_sacrifices.1.a.poor:0 "And there is nothing that listens to your invocations"

zz_valyria_item_crafting_human_sacrifice.01.opt.a:0 "Their soul shall be the fuel for my masterpiece."

### Further Magical Education System
further_magical_education_scheme:0 "Further Magical Studies"
further_magical_education_scheme_desc:0 "With dedication and diligence it ought to be possible to increase your abilities with the Higher Mysteries."#
further_magical_education_scheme_desc_general:0 "With dedication and diligence it ought to be possible to increase your abilities with the Higher Mysteries."
zz_valyria_magic_further_education.t:0 "Further Magical Studies:"
zz_valyria_magic_further_education.0001.t:0 "$zz_valyria_magic_further_education.t$ A productive Endeavour"
zz_valyria_magic_further_education.0001.desc:0 "The many weeks of time spent reading, reciting, and seeking the feeling of the arcane have been well spent. I have come to a greater understanding of my arcane powers, and I can definitvely say that I am closer now to the mastery of my chosen school of magic than I was when I began."
zz_valyria_magic_further_education.0001.a:0 "I shall be known to the ages."

zz_valyria_magic_further_education.0002.t:0 "$zz_valyria_magic_further_education.t$ Futile efforts"
zz_valyria_magic_further_education.0002.desc:0 "The study of the higher mysteries is not a project of the weak of heart."
zz_valyria_magic_further_education.0002.a:0 "Disappointing..."

zz_valyria_magic_further_education.1000.t:0 "$zz_valyria_magic_further_education.t$ Consulting Valyrian Lore"
zz_valyria_magic_further_education.1000.desc:0 "The mages of old Valyria were great and mighty in their prowess. Within the memory of your realm there are many accounts of the Valyrian Mages and their incredible spells of power, and their insights into the arcane powers of the cosmos. It would be possible to look to these sources for guidance in how to develop your magical abilities."
zz_valyria_magic_further_education.1000.a:0 "Consult oral traditions."
zz_valyria_magic_further_education.1000.b:0 "To the archives!"
zz_valyria_magic_further_education.1000.c:0 "I shall not do this."

zz_valyria_magic_further_education.1001.t:0 "$zz_valyria_magic_further_education.t$ Useful Valyrian Lore"
zz_valyria_magic_further_education.1001.desc:0 "You have come across mentions of the powers that govern the heavens and the way they transcend their physical localities and penetrate into the realm of the terrestial. These entities are governed by their greater grasp on the underlying forces that hold together existence. By touching these forces it is possible with suitable conceptual aids to manifest great and mighty powers and penetrate the physical plane. I have sought to commune with these powers, and I have an idea of a method of recitation that may just prove crucial."
zz_valyria_magic_further_education.1001.a: "Perfect!"

zz_valyria_magic_further_education.1002.t:0 "$zz_valyria_magic_further_education.t$ Useless Valyrian Lore"
zz_valyria_magic_further_education.1002.desc:0 "It is said that the old mages of lost Valyria would perform sacrifices of their blood to fire to try and link their offerings to the rewards of their powers. Such practices have undoubtedly contributed to the evolution of some of the religions of Essos, but you have your doubts about whether such an act of senseless sacrifice will truly make itself known in your experiments with the Higher Mysteries. After several attempts all you seem to have found is that your blood does not want to burn..."
zz_valyria_magic_further_education.1002.a:0 "Curses!"

zz_valyria_magic_further_education.1010.t:0 "$zz_valyria_magic_further_education.t$ Practice your Valyrian Incantations"
zz_valyria_magic_further_education.1010.desc:0 "The higher mysteries can be invoked through the careful receitation of incantations of the Valyrian tongue. To better wield these mysteries it is useful to take the time to carefully ennunciate these words and so better master the key distinctions between the many invocations that you can wield. This shall improve your ability to bring these mystical incantations to their full substance and so your ability to wield the higher mysteries."
zz_valyria_magic_further_education.1010.a:0 "I shall practice my incantions!"
zz_valyria_magic_further_education.1010.b:0 "I have better things to do."

zz_valyria_magic_further_education.1011.t:0 "$zz_valyria_magic_further_education.t$ Clear Ennunication"
zz_valyria_magic_further_education.1011.desc:0 "With careful phrasing, and clear diction you are able to pronounce the incantations from your scrolls with a precise and surgical clarity. It is evident that the time spent practicing your pronounciation of the ancient Valyrian spells has paid dividends. With this clear capability you know your progress in the Higher Mysteries is assured!"
zz_valyria_magic_further_education.1011.a:0 "Joyous!"

zz_valyria_magic_further_education.1012.t:0 "$zz_valyria_magic_further_education.t$ A Stumbling mess"
zz_valyria_magic_further_education.1012.desc:0 "Your words come with a stuttering pause. You cannot yet make the words produce the precise sound you need them to make. You hope that these somantic components of your spells will not negatively impact your ability to wield the higher mysteries, but it already seems that this has proven to be a false hope."
zz_valyria_magic_further_education.1012.a:0 "It is clear Tessarion does not smile upon me."

zz_valyria_magic_further_education.1020.t:0 "$zz_valyria_magic_further_education.t$ Study Valyrian Script"
zz_valyria_magic_further_education.1020.desc:0 "The script of the freehold is a wounderous form of linguistic expression that is required for deciphering much of the magical lore that remains in the world. It is necessary that you develop your understanding of this language so as to unlock the world of the higher mysteries if you want to progress in your studies."
zz_valyria_magic_further_education.1020.a:0 "With this work I shall progress!"
zz_valyria_magic_further_education.1020.b:0 "This is a waste of time"

zz_valyria_magic_further_education.1021.t:0 "$zz_valyria_magic_further_education.t$ Your grasp improves!"
zz_valyria_magic_further_education.1021.desc:0 "After many long and painful hours you have gained a deeper understanding of the written script of old Valyria."
zz_valyria_magic_further_education.1021.a:0 "One step at a time!"

zz_valyria_magic_further_education.1022.t:0 "$zz_valyria_magic_further_education.t$ You cannot decipher a thing!"
zz_valyria_magic_further_education.1022.desc:0 "Even with the countless hours you have spent studying the Valyrian characters it is clear that you have not made any progress."
zz_valyria_magic_further_education.1022.a:0 "This damned language!"

zz_valyria_magic_further_education.1030.t:0 "$zz_valyria_magic_further_education.t$ Experiments with Magical Glyphs"
zz_valyria_magic_further_education.1030.desc:0 "The mages of old Valyria were said to bind power not only through word and will, but through glyphs of strange geometry and hidden meaning. Across ruined stones, ancient scrolls, and fragments of dragonforged metal, traces of these sigils still endure. If studied and carefully replicated, such markings may reveal methods by which arcane force can be shaped, contained, or unleashed."
zz_valyria_magic_further_education.1030.a:0 "Recreate the simplest sigils."
zz_valyria_magic_further_education.1030.b:0 "Study the oldest inscriptions!"
zz_valyria_magic_further_education.1030.c:0 "I shall not meddle with this."

zz_valyria_magic_further_education.1031.t:0 "$zz_valyria_magic_further_education.t$ Potent Glyphic Discovery"
zz_valyria_magic_further_education.1031.desc:0 "After hours of careful tracing and observation, you uncover recurring patterns hidden within the ancient symbols. Certain lines channel intent, while curved forms seem to anchor mystical force in place. By combining these principles, you devise a new sequence of markings that may greatly strengthen your future workings."
zz_valyria_magic_further_education.1031.a:0 "Perfect!"

zz_valyria_magic_further_education.1032.t:0 "$zz_valyria_magic_further_education.t$ Misdrawn Glyphs"
zz_valyria_magic_further_education.1032.desc:0 "Many of the surviving glyphs prove incomplete, contradictory, or deliberately misleading. You spend long hours carving and redrawing symbols that do nothing beyond staining your hands with ash and ink. One particularly ambitious attempt produces only a burst of sparks and the smell of singed hair."
zz_valyria_magic_further_education.1032.a:0 "Curses!"

zz_valyria_magic_further_education.1040.t:0 "$zz_valyria_magic_further_education.t$ Practice Valyrian Incantations"
zz_valyria_magic_further_education.1040.desc:0 "The Higher Mysteries often rely upon careful recitation in the ancient tongue. A single misplaced emphasis may twist meaning, while poor cadence can drain the force from a spell entirely. Through diligent repetition and disciplined breathing, you may sharpen your mastery of these spoken invocations."
zz_valyria_magic_further_education.1040.a:0 "I shall perfect my incantations!"
zz_valyria_magic_further_education.1040.b:0 "I have better uses for my time."

zz_valyria_magic_further_education.1041.t:0 "$zz_valyria_magic_further_education.t$ Clear Enunciation"
zz_valyria_magic_further_education.1041.desc:0 "Your voice carries each ancient syllable with precision and confidence. Sounds once awkward now flow naturally, and the hidden structure of many spells becomes clearer with every phrase. Time spent in practice has greatly strengthened your command of mystical speech."
zz_valyria_magic_further_education.1041.a:0 "Excellent!"

zz_valyria_magic_further_education.1042.t:0 "$zz_valyria_magic_further_education.t$ Tongue-Tied Failure"
zz_valyria_magic_further_education.1042.desc:0 "Your words stumble and fracture. Harsh consonants refuse to form, vowels drift into nonsense, and several phrases emerge sounding more like tavern curses than sacred invocations. If anything, your confidence has suffered more than your technique."
zz_valyria_magic_further_education.1042.a:0 "Damn this treacherous tongue."

zz_valyria_magic_further_education.1050.t:0 "$zz_valyria_magic_further_education.t$ Study Valyrian Script"
zz_valyria_magic_further_education.1050.desc:0 "The written characters of old Valyria are elegant, layered, and perilously subtle. Many surviving grimoires and inscriptions cannot be understood without mastery of their script. If you are to delve deeper into arcane knowledge, you must improve your ability to read the language of the Freehold."
zz_valyria_magic_further_education.1050.a:0 "Through study, I shall advance."
zz_valyria_magic_further_education.1050.b:0 "This is a waste of effort."

zz_valyria_magic_further_education.1051.t:0 "$zz_valyria_magic_further_education.t$ Your Grasp Deepens"
zz_valyria_magic_further_education.1051.desc:0 "After many painstaking hours, obscure symbols begin to resolve into meaning. Passages once indecipherable now reveal grammar, structure, and hidden nuance. You have taken another meaningful step toward understanding the written wisdom of old Valyria."
zz_valyria_magic_further_education.1051.a:0 "One step at a time."

zz_valyria_magic_further_education.1052.t:0 "$zz_valyria_magic_further_education.t$ Utter Confusion"
zz_valyria_magic_further_education.1052.desc:0 "The characters blur together into maddening knots of ink and curves. Every page seems more perplexing than the last, and no amount of effort has granted clarity. For now, the written tongue of Valyria remains beyond your grasp."
zz_valyria_magic_further_education.1052.a:0 "This damned language!"

zz_valyria_magic_further_education.1060.t:0 "$zz_valyria_magic_further_education.t$ Meditate Upon Dragonfire"
zz_valyria_magic_further_education.1060.desc:0 "Some claim the old sorcerers learned much by contemplating living flame itself. In the dance of embers and the hunger of fire, hidden truths may be glimpsed. Long meditation before brazier or pyre may sharpen your intuition toward destructive mysteries."
zz_valyria_magic_further_education.1060.a:0 "I shall study the flames."
zz_valyria_magic_further_education.1060.b:0 "Pointless superstition."

zz_valyria_magic_further_education.1061.t:0 "$zz_valyria_magic_further_education.t$ Secrets in the Embers"
zz_valyria_magic_further_education.1061.desc:0 "Within the shifting coals you perceive patterns—spirals, sigils, and forms that linger in memory long after the fire dims. Whether vision or revelation, your understanding of fiery workings has grown."
zz_valyria_magic_further_education.1061.a:0 "The flames have spoken."

zz_valyria_magic_further_education.1062.t:0 "$zz_valyria_magic_further_education.t$ Smoke and Ash"
zz_valyria_magic_further_education.1062.desc:0 "Hours spent staring into flame have yielded little beyond watering eyes, smoke-choked lungs, and the smell of soot in your robes. If there were secrets there, they remained well hidden."
zz_valyria_magic_further_education.1062.a:0 "A miserable waste."

zz_valyria_magic_further_education.1070.t:0 "$zz_valyria_magic_further_education.t$ Debate with Court Mystics"
zz_valyria_magic_further_education.1070.desc:0 "Not all wisdom lies in books. Sorcerers, priests, hedge magi, and learned charlatans alike gather many strange theories. By engaging them in debate, you may refine your own understanding—or be led astray by fools."
zz_valyria_magic_further_education.1070.a:0 "Summon them at once."
zz_valyria_magic_further_education.1070.b:0 "I need no counsel."

zz_valyria_magic_further_education.1071.t:0 "$zz_valyria_magic_further_education.t$ Productive Disputation"
zz_valyria_magic_further_education.1071.desc:0 "Though many arguments were foolish, one exchange forces you to reconsider a long-held assumption. In defending your ideas, you sharpen them."
zz_valyria_magic_further_education.1071.a:0 "Useful indeed."

zz_valyria_magic_further_education.1072.t:0 "$zz_valyria_magic_further_education.t$ Circle of Fools"
zz_valyria_magic_further_education.1072.desc:0 "Hours vanish into nonsense, boasts, and contradictory claims. By the end, your patience is spent and your understanding no better than before."
zz_valyria_magic_further_education.1072.a:0 "Begone, idiots."

further_magical_education_complete:0 "$zz_valyria_magic_further_education.t$ Complete!"

zz_valyria_magic.0010.zz:0 "The flames begin to dim..."
zz_valyria_magic.0011.zz:0 "The shadows recede into the corners."
zz_valyria_magic.0012.zz:0 "The vision fades from my mind's eye."
zz_valyria_magic.0013.zz:0 "The elements return to their slumber."
zz_valyria_magic.0014.zz:0 "The ritual is complete."
zz_valyria_magic.0015.zz:0 "My will is done."
zz_valyria_magic.0016.zz:0 "The spirits fall silent."
zz_valyria_magic.0018.zz:0 "I have seen enough for today."
zz_valyria_magic.0019.zz:0 "Let the blood dry where it fell."
zz_valyria_magic.0020.zz:0 "The arcane winds settle."
zz_valyria_magic.0021.zz:0 "I shall reflect on these findings."
zz_valyria_magic.0022.zz:0 "The circle is closed."
zz_valyria_magic.0023.zz:0 "The incantation ends."
zz_valyria_magic.0024.zz:0 "The Grimoire is shut."
zz_valyria_magic.0025.zz:0 "So it was written, so it shall be."
zz_valyria_magic.0026.zz:0 "I emerge from the trance."
zz_valyria_magic.0027.zz:0 "The power sustains me."
