  ## Water Magic
  ## Interaction
  zz_valyria_magic_water_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tc$\n$zz_cwok$\n\nThe arts of [water_magic|E] allows for a most terrifying of actions. To bring forth the might of water as a physical force, to strike at your foes and bring them physically to ruin."

  ##Spell Options
  ##event
  zz_valyria_magic_water_magic.001.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.001.name$"
  zz_valyria_magic_water_magic.001.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe inhabitants of the Rhoyne were masters of binding the source of life to their purposes. They could remove rot, and strike dragons down from the air with spouts of furious water. Indeed, even their final act, to unleash a plague unto the waking world was born from their powers over the waters. Water is a mighty force, capable of crushing anything under its weight. You can strike down [recipient.GetFirstName] under an immense torrent, crushing their bones and rupturing their organs. Is this the weapon you want?"
  zz_valyria_magic_water_magic.001.opt.a:0 "Yes, let my fury free!"
  zz_valyria_magic_water_magic.001.opt.b:0 "Yes, strike them down with the waves!"

  zz_valyria_magic_water_magic.001.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_water_magic.001.toast.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.001.name$"
  zz_valyria_magic_water_magic.001.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ striking [recipient.GetFirstName] with a crushing blast of water"
  zz_valyria_magic_water_magic.001.toast.tt:0 "$zz_valyria_magic_water_magic.001.toast.desc$"
  zz_valyria_magic_water_magic.001.f.toast.t:0 "Failure [water_magic|E] - $zz_valyria_magic_water_magic.001.name$"
  zz_valyria_magic_water_magic.001.f.toast.desc:0 "$zz_toast_01$ [water_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_water_magic.001.f.toast.tt:0 "$zz_valyria_magic_water_magic.001.f.toast.desc$"

  zz_valyria_magic_water_magic.001.toast.tyranny:0 ""

  ## Interaction

  zz_valyria_magic_water_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_ta$\n$zz_da$\n$zz_ld$\n\nThe arts of [water_magic|E] allows for a most terrifying of actions. To bring forth the might of water as a physical force, to strike at the armies of your foe, to bring them to utter ruin upon the battlefied"
