  zz_valyria_magic_water_magic.003.toast.desc:0 "$zz_toast_01$ [water_magic|E], $zz_toast_02$ restoring the supplies of the army of [recipient.GetFirstName]"
  zz_valyria_magic_water_magic.003.toast.tt:0 "$zz_valyria_magic_water_magic.003.toast.desc$"
