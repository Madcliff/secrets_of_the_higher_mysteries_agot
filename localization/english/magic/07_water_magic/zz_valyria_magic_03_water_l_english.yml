  zz_valyria_magic_water_magic.003.t:0 "[water_magic|E] - $zz_valyria_magic_water_magic.003.name$"
  zz_valyria_magic_water_magic.003.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe inhabitants of the Rhoyne were masters of binding the source of life to their purposes. They could remove rot, and strike dragons down from the air with spouts of furious water. Indeed, even their final act, to unleash a plague unto the waking world was born from their powers over the waters.You can with the powers availiable to you, purify the waters near one of [recipient.GetFirstName] armies. This would refresh their supply and ability to wage war. Do you wish to?"
  zz_valyria_magic_water_magic.003.opt.a:0 "Yes, logistics win wars!"
  zz_valyria_magic_water_magic.003.opt.z:0 "No, do not cast!"
  ## Spell Toast
