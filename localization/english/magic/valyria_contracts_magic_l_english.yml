  zz_valyria_magic_study_magic_mystery_request:0 "Solve the situation potentially using your [learning|E]"
  zz_valyria_magic_study_magic_mystery_contract:0 "Magical Meditations: Divine Mystery"
  zz_valyria_magic_study_magic_mystery_desc:0 "The fall of Valyria did untold damage to the knowledge of the Higher Mysteries. It is possible for a skilled mage to descover a mystery by careful meditation and experimentation."
  zz_valyria_magic_study_magic_mystery_desc_title:0 "Acquire a new mystery of your choice."

  zz_valyria_magic_contracts.00101.t:0 "Magical Experiments"
  zz_valyria_magic_contracts.00101.desc:0 "Here in the province of [task_contract_location.GetBaseNameNoTier] there is a wide freedom of opporutnity to explore magic. These lands shall provide the resources for your practical experiments in the casting of magic."
  zz_valyria_magic_contracts.00101.desc.experiments_type.higher_mysteries:0 "//n/nThe focus of your current experiments is your general ability in the weaving, channelling, and controlling the mystical energies. Sucess shall lead your skills in $higher_mysteries$ to expand in leaps and bounds."
  zz_valyria_magic_contracts.00101.desc.experiments_type.blood_magic:0 "/n/nYour current agenda is the development of your abilities in the casting of $blood_magic$. This art is based upon the spilling and cajouling of the essential life giving fluid. Thus, this location, provides an opportunity for you to engage in the necessary transgressions without much fear of your art being discovered."
  zz_valyria_magic_contracts.00101.desc.experiments_type.dream_magic:0 "/n/nYour current plan is to develop your abilities in $dream_magic$. This esoteric art blurs the distinction between fantasy and reality, making the minds, the hopes, and the destinies of other beings the playground of a gifted practioner. But such magics inspire accute fear and disgust. While success in your experiments will let your powers transgress the limitations of mortal men, the knowledge that you are conducting such experiments could cause those around you a measure of fear."
  zz_valyria_magic_contracts.00101.desc.experiments_type.alchemy_magic:0 "/n/nYour current intention is to develop your skills in the wielding of $alchemy_magic$."
  zz_valyria_magic_contracts.00101.desc.experiments_type.shadow_magic:0 ""
  zz_valyria_magic_contracts.00101.desc.experiments_type.air_magic:0 ""
  zz_valyria_magic_contracts.00101.desc.experiments_type.fire_magic:0 ""
  zz_valyria_magic_contracts.00101.desc.experiments_type.water_magic:0 ""
  zz_valyria_magic_contracts.00101.desc.experiments_type.dragon_magic:0 ""

  zz_valyria_magic_contracts.00101.a:0 "Leverage my knowledge for my experiments"
  zz_valyria_magic_contracts.00101.b:0 "With careful diligence, I cast this mystery..."

  zz_valyria_magic_contracts.00102.t:0 "$zz_valyria_magic_contracts.00211.t$: Success"
  zz_valyria_magic_contracts.00102.desc.resolution_type.learning:0 "My superior learning has enabled my experiments in magical manipulation to achieve fruitful results. \nEven now I feel my understanding of the higher myseries expand, and that I my individual mysteries themselves grow in power and potential."
  zz_valyria_magic_contracts.00102.desc.outro:0 "\n\nIt is time now for me to prepare for my return to my duties. While I have been able to enjoy my magical explorations, the stresses of life can only be put off for so long."
  zz_valyria_magic_contracts.00102.a:0 "Knowledge is Power!"
  zz_valyria_magic_contracts.00103.t:0 "$zz_valyria_magic_contracts.00211.t$: Failure"
  zz_valyria_magic_contracts.00103.desc.resolution_type.learning:0 ""
  zz_valyria_magic_contracts.00103.desc.outro:0 ""
  zz_valyria_magic_contracts.00103.a:0 "Perhaps next time."

  zz_valyria_magic_contracts.00091.t:0 "Magical Meditations"
  zz_valyria_magic_contracts.00091.desc:0 "You have arrived in the province of [task_contract_location.GetBaseNameNoTier]. Here, isolated from the stresses of your responsibiltiies it is time to let your mind flow freely upon the mysteries of lost Valryia, those hidden mysteries that the lesser minds call 'magic'. /n/nWithin your meditations it might be possible to reach towards the ebbs and flows of esoteric energies and grasp in its fullness one of these arcane powers. This will let you grow in your stature as what the fearful call a mage. /n/nBut such secrets take effort to uncover, are you fully committed to this arduous path?"
  zz_valyria_magic_contracts.00091.a:0 "Within my mind is power."
  zz_valyria_magic_contracts.00092.t:0 "$zz_valyria_magic_contracts.00091.t$: Success"
  zz_valyria_magic_contracts.00092.desc.resolution_type.learning:0 ""
  zz_valyria_magic_contracts.00092.desc.outro:0 ""
  zz_valyria_magic_contracts.00093.t:0 "$zz_valyria_magic_contracts.00091.t$: Failure"
  zz_valyria_magic_contracts.00093.desc.learning:0 ""
  zz_valyria_magic_contracts.00093.desc.outro:0 ""

  zz_valyria_magic_contracts.00190.t:0 "$zz_valyria_magic_contracts.00091.t$: Mystery Selection"
  zz_valyria_magic_contracts.00190.desc:0 "With careful reflection you have been able to stumple upon the roots of mystery, It is now within your power to select a new mystery to learn. But first you must determine which magical discipline you should focus upon."
  zz_valyria_magic_contracts.00190.a:0 "I shall focus on this school!"

