  zz_valyria_magic_alchemy_magic.002.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ improving the construction rate of [recipient.GetFirstName]"
  zz_valyria_magic_alchemy_magic.002.toast.tt:0 "$zz_valyria_magic_alchemy_magic.002.toast.desc$"

  zz_valyria_magic_alchemy_magic.002.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.002.name$"
