  ## Alchemical Magic
  ## Interaction
  ##\n\nThe use of the arcane forces of [alchemy_magic|E] to increase the development in the chosen province of the selected subject.
  zz_valyria_magic_alchemy_magic_001.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_bsp$\n\nThe use of the arcane forces of [alchemy_magic|E] to increase the development in the chosen province of the selected subject. \n\nThrough the secret arts of [alchemy_magic|E] it is possible to enrich the very soil, to bring forth growth and prosperity."

  ## event
  zz_valyria_magic_alchemy_magic.001.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.001.name$"
  zz_valyria_magic_alchemy_magic.001.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe manipulation of substances is an ancient and arcane art. Though the pyromancers and some wondering chemists are thought to be what remains of such practices, at your command true alchemy can be done. It would be possible through such transmutations to enrich the very land of one of [recipient.GetFirstName]'s provinces. \n\nNow is the moment to choose, with but an arcane word of lost Valyria, and the prepared energies of magical might it would be possible to empower the province, but is it wise to so change the land itself?"
  zz_valyria_magic_alchemy_magic.001.opt.a:0 "Yes, Let the world be transmuted!"
  zz_valyria_magic_alchemy_magic.001.opt.z:0 "No, do not cast!"
  ## Spell Toast
  zz_valyria_magic_alchemy_magic.001.toast.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.001.name$"
  zz_valyria_magic_alchemy_magic.001.toast.desc:0 "$zz_toast_01$ [alchemy_magic|E], $zz_toast_02$ improving the development rate of [target.GetName]"
  zz_valyria_magic_alchemy_magic.001.toast.tt:0 "$zz_valyria_magic_alchemy_magic.001.toast.desc$"
  zz_valyria_magic_alchemy_magic.001.f.toast.t:0 "Failure [alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.001.name$"
  zz_valyria_magic_alchemy_magic.001.f.toast.desc:0 "$zz_toast_01$ [alchemy_magic],$zz_toast_02$ $zz_toast_03$.."  
  zz_valyria_magic_alchemy_magic.001.f.toast.tt:0 "$zz_valyria_magic_alchemy_magic.001.f.toast.desc$"


  ## Interaction
  zz_valyria_magic_alchemy_magic_002.tooltip.desc:0 "Effects:\n$zz_dop$\n$zz_tp$\n$zz_bsp$\n\nThrough the secret arts of [alchemy_magic|E] it is possible to empower the processes of construction. Helping to rapidly advance construction projects."

  ##event
  zz_valyria_magic_alchemy_magic.002.t:0 "[alchemy_magic|E] - $zz_valyria_magic_alchemy_magic.002.name$"
  zz_valyria_magic_alchemy_magic.002.desc:0 "[secondary_recipient.GetFirstName] stands ready to enact a mystery. \nThe manipulation of substances is an ancient and arcane art. Though the pyromancers and some wondering chemists are thought to be what remains of such practices, at your command true alchemy can be done. It would be possible through such transmutations to make more effortless the construction projects in [recipient.GetFirstName]'s provinces. But is it wise to rely upon magic in this way?"
  zz_valyria_magic_alchemy_magic.002.opt.a:0 "Yes, Let the world be transmuted!"
  zz_valyria_magic_alchemy_magic.002.opt.z:0 "No, do not cast!"
  ## Spell Toast
